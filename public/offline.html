<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F8F6EE">
  <title>Offline · Manikstu Seller</title>
  <link rel="icon" href="/icons/favicon-32.png" type="image/png">
  <style>
    :root { --forest: #174B32; --ivory: #F8F6EE; --ink: #26352E; --ink-2: #5D6A63; --line: #E5E2D6; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; background: var(--ivory); color: var(--ink); }
    body {
      min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
    }
    main { width: 100%; max-width: 380px; text-align: center; background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 32px 24px; box-shadow: 0 6px 24px rgba(23, 75, 50, 0.08); }
    img { width: 64px; height: 64px; display: block; margin: 0 auto 16px; }
    h1 { font-family: 'Playfair Display', Georgia, serif; font-size: 24px; color: var(--forest); margin-bottom: 10px; }
    p { color: var(--ink-2); font-size: 15px; line-height: 1.5; margin-bottom: 22px; }
    button {
      width: 100%; min-height: 48px; border: 0; border-radius: 12px; background: var(--forest); color: #fff;
      font: 600 15px/1 inherit; font-family: inherit; cursor: pointer;
    }
    button:focus-visible { outline: 3px solid #DCA72B; outline-offset: 3px; }
    small { display: block; margin-top: 14px; color: var(--ink-2); font-size: 12.5px; }
  </style>
</head>
<body>
  <main>
    <img src="/brand/manikstu-emblem.png" alt="Manikstu">
    <h1>You're offline</h1>
    <p>Manikstu Seller needs a connection to load your orders and stock. Check your mobile data or Wi-Fi, then try again.</p>
    <button type="button" id="retry">Try again</button>
    <small id="status" role="status" aria-live="polite">This page reloads by itself when you're back online.</small>
  </main>
  <script>
    document.getElementById('retry').addEventListener('click', function () { location.reload(); });
    window.addEventListener('online', function () {
      document.getElementById('status').textContent = 'Back online. Loading…';
      location.reload();
    });
  </script>
</body>
</html>
